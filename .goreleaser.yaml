# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cadence

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh scripts/completions.sh

builds:
  - id: cadence
    main: ./cmd/cadence
    binary: cadence
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: cadence
    ids: [cadence]
    name_template: "cadence_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # -rc/-beta tags publish as prereleases, so releases/latest (and /install-cli) skip them.
  prerelease: auto
  github:
    owner: rizwanreza
    name: cadence-cli
  # The curl installer is served from the release (cadenceweek.com/install-cli
  # redirects to releases/latest/download/install.sh), so it always matches
  # the binaries it installs.
  extra_files:
    - glob: scripts/install.sh

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

homebrew_casks:
  - name: cadence
    ids: [cadence]
    repository:
      owner: rizwanreza
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    # Release candidates don't touch the tap (and don't need HOMEBREW_TAP_TOKEN).
    skip_upload: auto
    homepage: https://cadenceweek.com/cli
    description: Run your 12-Week Year from the terminal, or let your agent do it
    binaries:
      - cadence
    completions:
      bash: completions/cadence.bash
      zsh: completions/cadence.zsh
      fish: completions/cadence.fish
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # The binaries aren't notarized yet, so Gatekeeper would quarantine them.
    # Remove this hook once releases are signed and notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cadence"]
          end
